
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>CAMPASS QR入退室受付</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background: #f3f8fc;
      color: #17365d;
    }

    .panel {
      max-width: 460px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-sizing: border-box;
    }

    h1 {
      color: #1765a3;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 24px;
    }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: 20px auto;
    }

    #result {
      background: #eef2f6;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      min-height: 30px;
    }

    .success {
      background: #e4f5e8 !important;
      color: #176b36;
    }

    .error {
      background: #fdeaea !important;
      color: #a12b2b;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
  </style>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>
</head>

<body>

<div class="panel">

  <h1>CAMPASS</h1>
  <div class="subtitle">QR入退室受付</div>

  <p>生徒専用QRコードをカメラにかざしてください</p>

  <div id="reader"></div>

  <div id="result">
    QRコードを読み取ってください
  </div>

  <p class="note">
    現在は読み取り機能の動作確認中です。
    入退室記録や保護者通知は行われません。
  </p>

</div>

<script>
  let lastText = "";
  let lastTime = 0;

  function showResult(message, type) {
    const area = document.getElementById("result");

    area.textContent = message;
    area.className = type || "";
  }

  function onScanSuccess(decodedText) {
    const now = Date.now();

    // 同じQRコードの連続読み取りを抑制
    if (
      decodedText === lastText &&
      now - lastTime < 5000
    ) {
      return;
    }

    lastText = decodedText;
    lastTime = now;

    // QRトークンは画面に表示しない
    showResult(
      "QRコードを読み取りました",
      "success"
    );
  }

  function onScanFailure(error) {
    // 読み取り途中のエラーは画面に表示しない
  }

  const scanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: {
        width: 220,
        height: 220
      }
    },
    false
  );

  scanner.render(
    onScanSuccess,
    onScanFailure
  );
</script>

</body>
</html>
