
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>CAMPASS QR入退室受付</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", sans-serif;
      background: #f3f8fc;
      color: #17365d;
      text-align: center;
    }

    .panel {
      width: 100%;
      max-width: 460px;
      min-height: 440px;
      margin: 25px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 22px rgba(0, 0, 0, .06);
    }

    .logo {
      margin: 10px 0 4px;
      color: #1765a3;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #65768a;
      font-size: 14px;
      margin-bottom: 36px;
    }

    h2 {
      margin: 15px 0;
      font-size: 23px;
    }

    p {
      line-height: 1.7;
    }

    .primary-button {
      display: block;
      width: 100%;
      padding: 20px 12px;
      margin: 30px auto 0;
      border: none;
      border-radius: 14px;
      background: #1765a3;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary-button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: white;
      color: #1765a3;
      border: 1px solid #1765a3;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }

    .success-icon {
      font-size: 65px;
      color: #25864c;
      margin-top: 35px;
    }

    .success-title {
      color: #25864c;
      font-size: 28px;
      font-weight: bold;
      margin: 15px 0;
    }

    .notice {
      color: #697789;
      font-size: 13px;
      margin-top: 35px;
    }

    #camera-error {
      color: #b42318;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>
  <div class="panel">

    <!-- トップ画面 -->
    <section id="home" class="screen active">
      <h1 class="logo">CAMPASS</h1>
      <div class="subtitle">QR入退室管理システム</div>

      <h2>入退室受付</h2>
      <p>
        QRコードをお持ちの方は<br>
        下のボタンを押してください。
      </p>

      <button
        class="primary-button"
        onclick="startReception()">
        QRコードを読み取る
      </button>

      <p class="notice">
        受付を開始するとカメラが起動します。
      </p>
    </section>

    <!-- QR読み取り画面 -->
    <section id="scan" class="screen">
      <h1 class="logo">CAMPASS</h1>
      <h2>QRコード読み取り</h2>

      <p>カメラにQRコードをかざしてください</p>

      <div id="reader"></div>

      <p id="camera-error" role="alert"></p>

      <button
        class="secondary-button"
        onclick="returnHome()">
        トップ画面に戻る
      </button>
    </section>

    <!-- 読み取り完了画面 -->
    <section id="complete" class="screen">
      <h1 class="logo">CAMPASS</h1>

      <div class="success-icon">✓</div>

      <div class="success-title">
        QR読み取り完了！
      </div>

      <p>
        QRコードを読み取りました。
      </p>

      <p class="notice">
        3秒後にトップ画面へ戻ります。
      </p>
    </section>

    <p class="notice">
      ※現在は動作確認用です。<br>
      入退室記録・保護者通知は行われません。
    </p>
  </div>

  <script>
    let scanner = null;
    let busy = false;
    let returnTimer = null;
    let sessionId = 0;

    function showScreen(id) {
      document.querySelectorAll(".screen")
        .forEach(function(screen) {
          screen.classList.remove("active");
        });

      document.getElementById(id)
        .classList.add("active");
    }

    async function stopCamera() {
      if (!scanner) return;

      const currentScanner = scanner;
      scanner = null;

      try {
        await currentScanner.stop();
      } catch (error) {
        console.warn("カメラ停止:", error);
      }

      try {
        currentScanner.clear();
      } catch (error) {
        console.warn("画面クリア:", error);
      }
    }

    async function startReception() {
      if (busy) return;

      busy = true;
      clearTimeout(returnTimer);

      const currentSession = ++sessionId;

      document.getElementById("camera-error")
        .textContent = "";

      showScreen("scan");

      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error(
            "QR読み取りライブラリを読み込めませんでした"
          );
        }

        await stopCamera();

        if (currentSession !== sessionId) return;

        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: {
              width: 220,
              height: 220
            }
          },
          function(decodedText) {
            onScanSuccess(decodedText, currentSession);
          },
          function() {
            // 読み取り途中のエラーは無視
          }
        );

      } catch (error) {
        if (currentSession === sessionId) {
          document.getElementById("camera-error")
            .textContent =
              "カメラを起動できませんでした。"
              + String(error.message || error);
        }
      } finally {
        if (currentSession === sessionId) {
          busy = false;
        }
      }
    }

    async function onScanSuccess(
      decodedText,
      currentSession
    ) {
      if (
        currentSession !== sessionId ||
        busy
      ) {
        return;
      }

      busy = true;

      // QRの内容は画面に表示しない
      // この段階ではサーバー送信もしない
      if (!decodedText) {
        busy = false;
        return;
      }

      ++sessionId;

      await stopCamera();

      showScreen("complete");

      returnTimer = setTimeout(function() {
        returnHome();
      }, 3000);

      busy = false;
    }

    async function returnHome() {
      ++sessionId;
      clearTimeout(returnTimer);

      showScreen("home");

      await stopCamera();

      busy = false;
    }
  </script>
</body>
</html>
