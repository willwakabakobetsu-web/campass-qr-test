
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>CAMPASS QR受付</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", Arial, sans-serif;
      background: #f2f5fa;
      color: #20314c;
      text-align: center;
    }

    .container {
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 32px 20px;
      background: white;
    }

    h1 {
      margin: 20px 0 4px;
      color: #173d70;
      font-size: 38px;
      letter-spacing: 3px;
    }

    .subtitle {
      color: #63748a;
      margin-bottom: 30px;
    }

    .status {
      padding: 14px;
      border-radius: 12px;
      background: #edf2f8;
      margin: 16px 0;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .success {
      background: #e4f5ea;
      color: #17643c;
    }

    .warning {
      background: #fff5dc;
      color: #8a5b16;
    }

    .error {
      background: #fff0ed;
      color: #a12d24;
    }

    button {
      width: 100%;
      padding: 20px;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      background: #1763ad;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #aab5c2;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 12px;
    }

    .hidden {
      display: none;
    }

    .check {
      font-size: 64px;
      color: #219653;
      margin-top: 35px;
    }

    .cross {
      font-size: 64px;
      color: #c0392b;
      margin-top: 35px;
    }

    .student-name {
      font-size: 32px;
      font-weight: bold;
      margin: 24px 0;
      overflow-wrap: anywhere;
    }

    .notice {
      margin-top: 24px;
      color: #8a5b16;
      background: #fff5dc;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
    }

    .uid {
      font-size: 11px;
      color: #7d8997;
      overflow-wrap: anywhere;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>CAMPASS</h1>
    <div class="subtitle">QR受付システム</div>

    <section id="home">

      <div id="firebaseStatus" class="status">
        Firebaseに接続しています...
      </div>

      <div id="workerStatus" class="status">
        Workersとの接続を待っています...
      </div>

      <div id="terminalStatus" class="status">
        端末登録情報を確認しています...
      </div>

      <button id="startButton" disabled>
        QRコードを読み取る
      </button>

      <div class="notice">
        現在はQR照合テストモードです。<br>
        生徒情報の照合のみ行います。<br>
        入退室記録・保護者通知は行いません。
      </div>

      <div id="uidDisplay" class="uid"></div>

    </section>

    <section id="scannerScreen" class="hidden">

      <h2>QRコードをかざしてください</h2>
      <p>カメラにQRコードを向けてください。</p>

      <div id="reader"></div>

      <div id="scanStatus" class="status hidden">
        QRコードを確認しています...
      </div>

      <button id="backButton">
        トップ画面に戻る
      </button>

    </section>

    <section id="resultScreen" class="hidden">

      <div id="resultIcon" class="check">✓</div>

      <h2 id="resultTitle">QR認証結果</h2>

      <div id="studentName" class="student-name"></div>

      <p id="resultMessage"></p>

      <div class="notice">
        テストモード：入退室は記録されません。
      </div>

      <button id="resultBackButton">
        トップ画面に戻る
      </button>

    </section>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBeGiWxWXQJY8QTCsrhj-0Dy-_7YHcUzJs",
      authDomain: "campass-6e543.firebaseapp.com",
      projectId: "campass-6e543",
      storageBucket: "campass-6e543.firebasestorage.app",
      messagingSenderId: "645876175494",
      appId: "1:645876175494:web:c81373704d656df0917707",
      measurementId: "G-VZB7Y9F1LE"
    };

    const API_URL =
      "https://campass-qr-api.will-wakaba-kobetsu.workers.dev";

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    let scanner = null;
    let scanning = false;
    let processing = false;
    let terminalAuthorized = false;
    let returnTimer = null;
    let sessionNumber = 0;

    const home = document.getElementById("home");
    const scannerScreen =
      document.getElementById("scannerScreen");
    const resultScreen =
      document.getElementById("resultScreen");

    const firebaseStatus =
      document.getElementById("firebaseStatus");
    const workerStatus =
      document.getElementById("workerStatus");
    const terminalStatus =
      document.getElementById("terminalStatus");
    const startButton =
      document.getElementById("startButton");
    const uidDisplay =
      document.getElementById("uidDisplay");

    const scanStatus =
      document.getElementById("scanStatus");
    const resultIcon =
      document.getElementById("resultIcon");
    const resultTitle =
      document.getElementById("resultTitle");
    const studentName =
      document.getElementById("studentName");
    const resultMessage =
      document.getElementById("resultMessage");

    function setStatus(element, message, type = "") {
      element.textContent = message;
      element.className = "status " + type;
    }

    function showScreen(screen) {
      home.classList.add("hidden");
      scannerScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      screen.classList.remove("hidden");
    }

    function clearReturnTimer() {
      if (returnTimer !== null) {
        clearTimeout(returnTimer);
        returnTimer = null;
      }
    }

    function resetAuthorization() {
      terminalAuthorized = false;
      startButton.disabled = true;
    }

    async function requestWorker(path, body) {
      const user = auth.currentUser;

      if (!user) {
        throw new Error("Firebase認証が必要です");
      }

      const idToken = await user.getIdToken();

      const controller = new AbortController();
      const timeout = setTimeout(() => {
        controller.abort();
      }, 30000);

      try {
        const response = await fetch(API_URL + path, {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + idToken,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body || {}),
          signal: controller.signal,
          cache: "no-store"
        });

        const result = await response.json();

        if (!response.ok || result.ok !== true) {
          throw new Error(
            result.message || "サーバーとの通信に失敗しました"
          );
        }

        return result;
      } finally {
        clearTimeout(timeout);
      }
    }

    auth.onAuthStateChanged(async user => {
      resetAuthorization();

      if (!user) {
        setStatus(
          firebaseStatus,
          "Firebase匿名認証を開始しています..."
        );

        try {
          await auth.signInAnonymously();
        } catch (error) {
          setStatus(
            firebaseStatus,
            "Firebase認証失敗：" + error.message,
            "error"
          );
        }

        return;
      }

      setStatus(
        firebaseStatus,
        "Firebase接続成功（匿名認証）",
        "success"
      );

      uidDisplay.textContent = "UID: " + user.uid;

      await checkWorkerAuthentication(user);
    });

    async function checkWorkerAuthentication(user) {
      setStatus(
        workerStatus,
        "Cloudflare Workersで認証を確認中..."
      );

      setStatus(
        terminalStatus,
        "Firestoreの登録端末を照合中..."
      );

      try {
        const result = await requestWorker(
          "/auth/check",
          {}
        );

        if (result.uid !== user.uid) {
          throw new Error("認証UIDが一致しません");
        }

        setStatus(
          workerStatus,
          "Workers認証成功！",
          "success"
        );

        if (
          result.terminalRegistered === true &&
          result.terminalAuthorized === true
        ) {
          terminalAuthorized = true;

          setStatus(
            terminalStatus,
            "端末認証成功（利用可能）",
            "success"
          );

          startButton.disabled = false;

        } else if (
          result.terminalRegistered === true &&
          result.terminalStatus === "inactive"
        ) {
          setStatus(
            terminalStatus,
            "登録済み・利用停止中（inactive）",
            "warning"
          );

        } else {
          setStatus(
            terminalStatus,
            "未登録または利用不可の端末です",
            "error"
          );
        }

      } catch (error) {
        resetAuthorization();

        setStatus(
          workerStatus,
          "Workers認証失敗：" + error.message,
          "error"
        );

        setStatus(
          terminalStatus,
          "端末情報を確認できませんでした",
          "error"
        );
      }
    }

    async function startScanner() {
      if (
        !terminalAuthorized ||
        scanning ||
        scanner ||
        processing
      ) {
        return;
      }

      clearReturnTimer();

      sessionNumber++;
      const thisSession = sessionNumber;

      processing = false;
      showScreen(scannerScreen);
      scanStatus.classList.add("hidden");

      startButton.disabled = true;

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "user" },
          {
            fps: 10,
            qrbox: {
              width: 230,
              height: 230
            }
          },
          decodedText => {
            onQrSuccess(decodedText, thisSession);
          },
          () => {}
        );

        scanning = true;

        if (thisSession !== sessionNumber) {
          await stopScanner();
        }

      } catch (error) {
        await stopScanner();

        if (thisSession === sessionNumber) {
          alert(
            "カメラを起動できませんでした。\n" +
            error.message
          );
          showScreen(home);
          startButton.disabled = !terminalAuthorized;
        }
      }
    }

    async function onQrSuccess(decodedText, thisSession) {
      if (
        processing ||
        thisSession !== sessionNumber
      ) {
        return;
      }

      processing = true;

      scanStatus.textContent =
        "生徒マスターと照合しています...";
      scanStatus.className = "status";

      // 同じQRを繰り返し読み取らないよう停止
      await stopScanner();

      try {
        const result = await requestWorker(
          "/qr/verify",
          {
            qrToken: decodedText
          }
        );

        if (thisSession !== sessionNumber) {
          return;
        }

        if (result.verified === true) {
          showResult(
            true,
            result.name,
            "生徒マスターとの照合に成功しました"
          );
        } else {
          showResult(
            false,
            "",
            result.message || "QR照合に失敗しました"
          );
        }

      } catch (error) {
        if (thisSession !== sessionNumber) {
          return;
        }

        showResult(
          false,
          "",
          error.name === "AbortError"
            ? "通信がタイムアウトしました"
            : error.message
        );
      }
    }

    function showResult(success, name, message) {
      resultIcon.textContent = success ? "✓" : "×";
      resultIcon.className = success ? "check" : "cross";

      resultTitle.textContent = success
        ? "QR認証成功"
        : "QR認証失敗";

      studentName.textContent = success ? name : "";
      resultMessage.textContent = message;

      showScreen(resultScreen);

      clearReturnTimer();

      returnTimer = setTimeout(() => {
        returnTimer = null;
        returnHome();
      }, success ? 5000 : 7000);
    }

    async function stopScanner() {
      if (!scanner) {
        scanning = false;
        return;
      }

      const currentScanner = scanner;
      scanner = null;

      try {
        if (scanning) {
          await currentScanner.stop();
        }
      } catch (error) {
        console.warn("カメラ停止:", error);
      }

      try {
        await currentScanner.clear();
      } catch (error) {
        console.warn("画面クリア:", error);
      }

      scanning = false;
    }

    async function returnHome() {
      sessionNumber++;
      clearReturnTimer();

      processing = true;
      await stopScanner();

      showScreen(home);
      resetAuthorization();
      processing = false;

      const user = auth.currentUser;

      if (user) {
        await checkWorkerAuthentication(user);
      }
    }

    document.getElementById("startButton")
      .addEventListener("click", startScanner);

    document.getElementById("backButton")
      .addEventListener("click", returnHome);

    document.getElementById("resultBackButton")
      .addEventListener("click", returnHome);
  </script>
</body>
</html>
