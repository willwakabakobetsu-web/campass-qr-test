
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>CAMPASS QR受付</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", Arial, sans-serif;
      background: #f2f5fa;
      color: #20314c;
      text-align: center;
    }

    .container {
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 32px 20px;
      background: white;
    }

    h1 {
      margin: 20px 0 4px;
      color: #173d70;
      font-size: 38px;
      letter-spacing: 3px;
    }

    .subtitle {
      color: #63748a;
      margin-bottom: 30px;
    }

    .status {
      padding: 14px;
      border-radius: 12px;
      background: #edf2f8;
      margin: 16px 0;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .success {
      background: #e4f5ea;
      color: #17643c;
    }

    .error {
      background: #fff0ed;
      color: #a12d24;
    }

    button {
      width: 100%;
      padding: 20px;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      background: #1763ad;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #aab5c2;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 12px;
    }

    .hidden {
      display: none;
    }

    .check {
      font-size: 64px;
      color: #219653;
      margin-top: 50px;
    }

    .notice {
      margin-top: 24px;
      color: #8a5b16;
      background: #fff5dc;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
    }

    .uid {
      font-size: 11px;
      color: #7d8997;
      overflow-wrap: anywhere;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>CAMPASS</h1>
    <div class="subtitle">QR受付システム</div>

    <section id="home">
      <div id="firebaseStatus" class="status">
        Firebaseに接続しています...
      </div>

      <div id="workerStatus" class="status">
        Workersとの接続を待っています...
      </div>

      <button id="startButton"
              onclick="startScanner()" disabled>
        QRコードを読み取る
      </button>

      <div class="notice">
        現在は接続テストモードです。<br>
        QRを読み取っても入退室は記録されません。
      </div>

      <div id="uidDisplay" class="uid"></div>
    </section>

    <section id="scannerScreen" class="hidden">
      <h2>QRコードをかざしてください</h2>
      <p>カメラにQRコードを向けてください。</p>

      <div id="reader"></div>

      <button onclick="returnHome()">
        トップ画面に戻る
      </button>
    </section>

    <section id="resultScreen" class="hidden">
      <div class="check">✓</div>
      <h2>QRコードを読み取りました</h2>
      <p>読み取りテスト成功</p>
      <p>3秒後にトップ画面に戻ります。</p>

      <div class="notice">
        入退室の登録はまだ行っていません。
      </div>
    </section>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBeGiWxWXQJY8QTCsrhj-0Dy-_7YHcUzJs",
      authDomain: "campass-6e543.firebaseapp.com",
      projectId: "campass-6e543",
      storageBucket: "campass-6e543.firebasestorage.app",
      messagingSenderId: "645876175494",
      appId: "1:645876175494:web:c81373704d656df0917707",
      measurementId: "G-VZB7Y9F1LE"
    };

    const API_URL =
      "https://campass-qr-api.will-wakaba-kobetsu.workers.dev";

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    let scanner = null;
    let scanning = false;
    let processing = false;
    let connectionVerified = false;
    let returnTimer = null;

    const home = document.getElementById("home");
    const scannerScreen =
      document.getElementById("scannerScreen");
    const resultScreen =
      document.getElementById("resultScreen");

    const firebaseStatus =
      document.getElementById("firebaseStatus");
    const workerStatus =
      document.getElementById("workerStatus");
    const startButton =
      document.getElementById("startButton");
    const uidDisplay =
      document.getElementById("uidDisplay");

    function setStatus(element, message, type = "") {
      element.textContent = message;
      element.className = "status " + type;
    }

    function showScreen(screen) {
      home.classList.add("hidden");
      scannerScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");

      screen.classList.remove("hidden");
    }

    function resetConnectionState() {
      connectionVerified = false;
      startButton.disabled = true;
    }

    auth.onAuthStateChanged(async user => {
      resetConnectionState();

      if (!user) {
        setStatus(
          firebaseStatus,
          "Firebase匿名認証を開始しています..."
        );

        try {
          await auth.signInAnonymously();
        } catch (error) {
          setStatus(
            firebaseStatus,
            "Firebase認証失敗：" + error.message,
            "error"
          );
        }

        return;
      }

      setStatus(
        firebaseStatus,
        "Firebase接続成功（匿名認証）",
        "success"
      );

      uidDisplay.textContent = "UID: " + user.uid;

      await checkWorkerAuthentication(user);
    });

    async function checkWorkerAuthentication(user) {
      setStatus(
        workerStatus,
        "Cloudflare Workersで認証を確認中..."
      );

      try {
        const idToken = await user.getIdToken();

        const response = await fetch(
          API_URL + "/auth/check",
          {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + idToken
            }
          }
        );

        const result = await response.json();

        if (
          response.ok &&
          result.ok === true &&
          result.uid === user.uid &&
          result.terminalAuthorized === false
        ) {
          connectionVerified = true;

          setStatus(
            workerStatus,
            "Workers認証成功！Firebaseトークンを検証できました。",
            "success"
          );

          // テストモードのみカメラを使用可能にする
          startButton.disabled = false;
        } else {
          throw new Error(
            result.message || "認証結果が一致しません"
          );
        }
      } catch (error) {
        resetConnectionState();

        setStatus(
          workerStatus,
          "Workers認証失敗：" + error.message,
          "error"
        );
      }
    }

    async function startScanner() {
      if (!connectionVerified || scanning) {
        return;
      }

      if (!auth.currentUser) {
        return;
      }

      if (returnTimer) {
        clearTimeout(returnTimer);
        returnTimer = null;
      }

      showScreen(scannerScreen);
      processing = false;

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "user" },
          {
            fps: 10,
            qrbox: {
              width: 230,
              height: 230
            }
          },
          onQrSuccess,
          () => {}
        );

        scanning = true;
      } catch (error) {
        scanning = false;
        scanner = null;

        alert(
          "カメラを起動できませんでした。\n" +
          error.message
        );

        showScreen(home);
      }
    }

    async function onQrSuccess(decodedText) {
      if (processing) {
        return;
      }

      processing = true;

      // この段階ではQRの内容をサーバーへ送らない
      // 入退室記録も行わない

      await stopScanner();

      showScreen(resultScreen);

      returnTimer = setTimeout(() => {
        returnTimer = null;
        showScreen(home);
      }, 3000);
    }

    async function stopScanner() {
      if (!scanner) {
        scanning = false;
        return;
      }

      const currentScanner = scanner;
      scanner = null;

      try {
        if (scanning) {
          await currentScanner.stop();
        }
      } catch (error) {
        console.warn("カメラ停止:", error);
      }

      try {
        currentScanner.clear();
      } catch (error) {
        console.warn("画面クリア:", error);
      }

      scanning = false;
    }

    async function returnHome() {
      if (returnTimer) {
        clearTimeout(returnTimer);
        returnTimer = null;
      }

      processing = true;
      await stopScanner();
      showScreen(home);
      processing = false;
    }
  </script>
</body>
</html>
